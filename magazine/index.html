<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine | The Nerd's Show</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .magazine-container {
            padding-top: 15vh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 5rem;
        }

        .magazine-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .magazine-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, #fff 40%, rgba(255, 255, 255, 0.4) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .magazine-viewer {
            width: 100%;
            height: 80vh;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .magazine-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-link {
            margin-top: 2rem;
            color: var(--accent-teal);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.8;
            transform: translateX(-5px);
        }
    </style>
</head>

<body class="dark-theme">
    <div class="background-effects">
        <div class="aura-glow top-left"></div>
        <div class="aura-glow bottom-right"></div>
        <div class="aura-glow central"></div>
        <div class="grain-overlay"></div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="/">
                    <img src="/nerdshow.png" alt="The Nerd's Show Logo" class="logo-img">
                </a>
            </div>
            <div class="menu-toggle" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <div class="nav-overlay" id="nav-overlay">
        <div class="nav-menu">
            <a href="/" class="nav-item">Home</a>
            <a href="/magazine/" class="nav-item">Magazine</a>
            <a href="#" class="nav-item">Episodes</a>
            <a href="#" class="nav-item">Contact</a>
        </div>
    </div>

    <main class="magazine-container">
        <div class="magazine-header">
            <h1 class="magazine-title">The Nerd Show Magazine</h1>
            <p class="description">Our inaugural edition features the story of Intel Fellow Shesha Krishnapura.</p>
        </div>

        <div class="magazine-viewer">
            <iframe src="/shesha_magazine.pdf#toolbar=0" type="application/pdf"></iframe>
        </div>

        <a href="/" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Home
        </a>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="copyright">© The Nerd's Show 2026</div>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/mayank-sharma-82ba20143/">LinkedIn</a>
                <a href="#">Mail</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/main.js"></script>
</body>

</html>
